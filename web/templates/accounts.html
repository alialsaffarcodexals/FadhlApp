<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Accounts</title>
<link rel="stylesheet" href="../static/style.css">
<script src="../static/script.js" defer></script>
</head>
<body>
<h1>Accounts</h1>
<table>
  <tr><th>Name</th><th>Email</th><th>Password</th></tr>
  {{range .}}
  <tr><td>{{.Name}}</td><td>{{.Email}}</td><td>{{.Password}}</td></tr>
  {{end}}
</table>
<a href="/dashboard">Return to menu</a>
</body>
</html>
